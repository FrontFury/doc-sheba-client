<svg viewBox="0 0 300 600" width="300" height="600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .body-part { fill: #b09564; cursor: pointer; transition: fill 0.3s; stroke: #ffffff; stroke-width: 1.5; }
    .body-part:hover { fill: #c82333; }
    .body-part.active { fill: #a71d2a; }
  </style>
  
  <g id="female-anatomy">
    <!-- Head -->
    <path id="head" class="body-part" d="M 128 45 C 128 25, 172 25, 172 45 C 172 80, 168 98, 150 106 C 132 98, 128 80, 128 45 Z" fill="#c82333" />
    
    <!-- Neck -->
    <path id="neck" class="body-part" d="M 138 106 L 162 106 L 166 125 L 134 125 Z" />
    
    <!-- Chest / Bust -->
    <path id="chest" class="body-part" d="M 115 128 C 130 125, 170 125, 185 128 C 192 155, 182 188, 150 188 C 118 188, 108 155, 115 128 Z" />
    
    <!-- Waist & Abdomen -->
    <path id="abdomen" class="body-part" d="M 122 190 C 135 190, 165 190, 178 190 C 172 235, 175 270, 150 275 C 125 270, 128 235, 122 190 Z" />
    
    <!-- Arms -->
    <g id="arms">
      <!-- Left Arm -->
      <path id="left-arm" class="body-part" d="M 110 130 C 98 145, 82 185, 72 245 C 65 285, 58 315, 48 325 C 52 342, 64 342, 74 315 C 84 255, 96 195, 110 155 Z" />
      <!-- Right Arm -->
      <path id="right-arm" class="body-part" d="M 190 130 C 202 145, 218 185, 228 245 C 235 285, 242 315, 252 325 C 248 342, 236 342, 226 315 C 216 255, 204 195, 190 155 Z" />
    </g>
    
    <!-- Wider Hips / Pelvis -->
    <path id="pelvis" class="body-part" d="M 115 278 C 132 278, 168 278, 185 278 C 195 320, 175 350, 150 355 C 125 350, 105 320, 115 278 Z" />
    
    <!-- Legs -->
    <g id="legs">
      <!-- Left Leg -->
      <path id="left-leg" class="body-part" d="M 120 355 C 130 400, 131 450, 127 500 C 124 540, 112 570, 98 585 L 130 585 C 140 560, 145 500, 145 450 C 145 400, 142 360, 142 358 Z" />
      <!-- Right Leg -->
      <path id="right-leg" class="body-part" d="M 180 355 C 170 400, 169 450, 173 500 C 176 540, 188 570, 202 585 L 170 585 C 160 560, 155 500, 155 450 C 155 400, 158 360, 158 358 Z" />
    </g>
  </g>
</svg>
