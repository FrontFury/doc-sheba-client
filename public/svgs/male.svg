<svg viewBox="0 0 300 600" width="300" height="600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .body-part { fill: #b09564; cursor: pointer; transition: fill 0.3s; stroke: #ffffff; stroke-width: 1.5; }
    .body-part:hover { fill: #c82333; }
    .body-part.active { fill: #a71d2a; }
  </style>
  
  <g id="male-anatomy">
    <!-- Head -->
    <path id="head" class="body-part" d="M 125 40 C 125 20, 175 20, 175 40 C 175 80, 170 100, 150 110 C 130 100, 125 80, 125 40 Z" fill="#c82333" />
    
    <!-- Neck -->
    <path id="neck" class="body-part" d="M 135 110 L 165 110 L 170 130 L 130 130 Z" />
    
    <!-- Chest (Pectorals) -->
    <path id="chest" class="body-part" d="M 110 135 C 130 130, 170 130, 190 135 C 195 160, 185 195, 150 195 C 115 195, 105 160, 110 135 Z" />
    
    <!-- Abdomen (Abs) -->
    <path id="abdomen" class="body-part" d="M 118 198 C 135 198, 165 198, 182 198 C 180 250, 175 285, 150 290 C 125 285, 120 250, 118 198 Z" />
    
    <!-- Arms -->
    <g id="arms">
      <!-- Left Arm -->
      <path id="left-arm" class="body-part" d="M 105 138 C 90 150, 75 190, 65 250 C 58 290, 52 320, 40 330 C 45 350, 58 350, 68 320 C 80 260, 92 200, 105 165 Z" />
      <!-- Right Arm -->
      <path id="right-arm" class="body-part" d="M 195 138 C 210 150, 225 190, 235 250 C 242 290, 248 320, 260 330 C 255 350, 242 350, 232 320 C 220 260, 208 200, 195 165 Z" />
    </g>
    
    <!-- Pelvis / Hips -->
    <path id="pelvis" class="body-part" d="M 120 292 C 135 292, 165 292, 180 292 C 185 330, 170 350, 150 355 C 130 350, 115 330, 120 292 Z" />
    
    <!-- Legs -->
    <g id="legs">
      <!-- Left Leg -->
      <path id="left-leg" class="body-part" d="M 122 355 C 130 400, 132 450, 128 500 C 125 540, 110 570, 95 585 L 130 585 C 142 560, 148 500, 148 450 C 148 400, 145 360, 145 358 Z" />
      <!-- Right Leg -->
      <path id="right-leg" class="body-part" d="M 178 355 C 170 400, 168 450, 172 500 C 175 540, 190 570, 205 585 L 170 585 C 158 560, 152 500, 152 450 C 152 400, 155 360, 155 358 Z" />
    </g>
  </g>
</svg>
